  <script src="common.js?v=20260427-10"></script>
  <script>
    const SHOWCASE_CATEGORY_LABELS = {
      activities: '党建+AI活动',
      members: '成员风采',
      honors: '荣誉成果',
      intro: '社团简介'
    };

    function escHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function toParagraphs(text) {
      const lines = String(text || '').trim().split(/\r?\n+/).map(line => line.trim()).filter(Boolean);
      if (!lines.length) return '<p>暂无详细内容。</p>';
      return lines.map(line => `<p>${escHtml(line)}</p>`).join('');
    }

    function renderItemContent(category, item) {
      const parts = [];
      if (item.content) parts.push(...String(item.content).split(/\r?\n+/).filter(Boolean));
      if (category === 'members') {
        parts.unshift(`成员：${item.name || '-'}`);
        parts.push(`岗位：${item.role || '-'}`);
        if (item.major) parts.push(`专业：${item.major}`);
      }
      if (category === 'honors') {
        if (item.level) parts.push(`荣誉级别：${item.level}`);
      }
      if (category === 'activities') {
        if (item.date) parts.push(`活动时间：${item.date}`);
      }
      const imageHtml = item.image
        ? `<div style="margin-bottom:24px;"><img src="${escHtml(item.image)}" alt="${escHtml(item.title || item.name || '社团风采图片')}" style="width:100%;max-height:420px;object-fit:cover;border-radius:18px;border:1px solid var(--border);"></div>`
        : '';
      return imageHtml + toParagraphs(parts.join('\n'));
    }

    async function loadShowcaseDetail() {
      const params = new URLSearchParams(window.location.search);
      const category = String(params.get('category') || 'activities').trim();
      const id = Number(params.get('id'));
      if (!id) return;

      document.getElementById('detailCategoryLabel').textContent = SHOWCASE_CATEGORY_LABELS[category] || '风采详情';

      try {
        const list = await getShowcaseContent(category);
        const item = Array.isArray(list) ? list.find(n => Number(n.id) === id) : null;
        if (!item) {
          document.getElementById('detailContent').innerHTML = '<p>未找到对应内容，请返回列表重试。</p>';
          return;
        }

        const title = item.title || item.name || '风采详情';
        document.title = `${title} - 智汇AI党建平台`;
        document.getElementById('detailTitle').textContent = title;
        document.getElementById('detailDate').textContent = `📅 ${item.date || '-'}`;
        document.getElementById('detailTag').textContent = item.tag || SHOWCASE_CATEGORY_LABELS[category] || '风采';
        document.getElementById('detailTag').className = `badge badge-${item.tagColor || 'blue'}`;
        document.getElementById('detailTag').style.background = 'rgba(255,255,255,0.15)';
        document.getElementById('detailTag').style.color = '#fff';

        document.getElementById('detailContent').innerHTML = renderItemContent(category, item);
      } catch (error) {
        document.getElementById('detailContent').innerHTML = '<p>内容加载失败，请稍后重试。</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      updateNavigation();
      loadShowcaseDetail();
    });
  </script>
</body>
